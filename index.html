<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#F6F1E8" />
<title>Budget — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F6F1E8;
    --surface:#FFFDF9;
    --surface-alt:#FBF4E8;
    --ink:#2C241C;
    --ink-soft:#7A6F60;
    --ink-faint:#B4A990;
    --line:#E7DCC7;
    --track:#EBE2D1;
    --clay:#BE7554;
    --sage:#7C8D68;
    --dusk:#5F7C8A;
    --ochre:#C99A44;
    --plum:#8C6478;
    --stone:#8A8175;
    --berry:#9C5F5A;
    --moss:#5C6E4E;
    --over:#A6402C;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:'Work Sans', -apple-system, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  .display{font-family:'Fraunces', serif;}

  .app-shell{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 28px);
    display:flex;
    flex-direction:column;
    gap:30px;
    position:relative;
    opacity:0;
    animation:fadeIn .5s ease forwards;
  }
  @keyframes fadeIn{ to{opacity:1;} }

  /* ---------- Header ---------- */
  .header{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px;}
  h1{font-weight:600;font-size:25px;letter-spacing:-.01em;}
  .days-tag{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}

  /* ---------- Donut ---------- */
  .donut-wrap{position:relative;display:flex;align-items:center;justify-content:center;padding:6px 0 2px;}
  .donut-svg{width:250px;height:250px;}
  .donut-center{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;}
  .donut-amount{font-weight:600;font-size:33px;font-variant-numeric:tabular-nums;line-height:1;}
  .donut-amount.over{color:var(--over);}
  .donut-label{font-size:12px;color:var(--ink-soft);}
  .donut-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;}

  /* ---------- Category list ---------- */
  .section-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:2px;}
  .cat-list{display:flex;flex-direction:column;gap:17px;}
  .cat-row{display:flex;flex-direction:column;gap:7px;}
  .cat-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:10px;}
  .cat-name{display:flex;align-items:center;gap:9px;font-weight:500;min-width:0;}
  .cat-name span.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cat-amounts{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap;}
  .cat-amounts b{color:var(--ink);font-weight:600;}
  .bar-track{height:6px;border-radius:4px;background:var(--track);overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.32,.72,0,1);}

  .empty-note{font-size:13px;color:var(--ink-faint);padding:6px 0 2px;}

  /* ---------- Action buttons ---------- */
  .actions{display:flex;gap:12px;margin-top:2px;}
  .btn{flex:1;padding:15px;border-radius:999px;border:none;font-family:inherit;font-weight:600;font-size:14px;
       display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
       transition:transform .15s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--ink);color:var(--surface);box-shadow:0 8px 18px rgba(44,36,28,.18);}
  .btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}

  /* ---------- Overlay & Sheets ---------- */
  .overlay{position:fixed;inset:0;background:rgba(35,29,22,.38);backdrop-filter:blur(2px);
           opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40;}
  .overlay.show{opacity:1;pointer-events:auto;}

  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--surface);
         border-radius:26px 26px 0 0;padding:12px 22px calc(env(safe-area-inset-bottom) + 26px);
         transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);
         z-index:41;max-height:88vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(44,36,28,.18);}
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .sheet h2{font-family:'Fraunces',serif;font-size:21px;font-weight:600;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:4px;}

  /* ---------- Form fields ---------- */
  .field{margin-bottom:22px;}
  .field > label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);
                 margin-bottom:8px;font-weight:600;}
  .amount-input-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--line);padding-bottom:8px;}
  .amount-input-wrap.focused{border-color:var(--ink);}
  .amount-input-wrap .currency{font-size:20px;color:var(--ink-soft);font-family:'Fraunces',serif;font-weight:600;}
  .amount-input-wrap input{border:none;background:transparent;font-family:'Fraunces',serif;font-size:34px;font-weight:600;
                            width:100%;color:var(--ink);font-variant-numeric:tabular-nums;}
  .amount-input-wrap input:focus{outline:none;}
  .amount-input-wrap input::placeholder{color:var(--ink-faint);}

  .note-input{width:100%;border:none;border-bottom:1.5px solid var(--line);background:transparent;
              font-family:inherit;font-size:15px;padding:9px 2px;color:var(--ink);}
  .note-input:focus{outline:none;border-color:var(--ink);}

  .chip-grid{display:flex;flex-wrap:wrap;gap:9px;}
  .chip{padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:500;
        background:var(--surface-alt);cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;
        color:var(--ink);transition:all .15s ease;}
  .chip.selected{border-color:var(--ink);background:var(--ink);color:var(--surface);}
  .chip .dot{width:8px;height:8px;}

  .sheet-submit{width:100%;margin-top:6px;}
  .form-error{font-size:12.5px;color:var(--over);margin:-10px 0 16px;min-height:1px;}

  /* ---------- Settings: category rows ---------- */
  .setting-cat-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .swatch-btn{width:22px;height:22px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
              box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line);}
  .setting-cat-row .name-input{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;
                                font-size:14px;font-weight:500;padding:5px 2px;border-bottom:1px solid transparent;color:var(--ink);}
  .setting-cat-row .name-input:focus{outline:none;border-bottom:1px solid var(--ink);}
  .icon-btn{background:none;border:none;color:var(--ink-faint);font-size:17px;cursor:pointer;padding:4px 2px;
             line-height:1;flex-shrink:0;}
  .icon-btn:active{color:var(--over);}

  .swatch-row{display:flex;gap:9px;padding:2px 0 12px 32px;flex-wrap:wrap;}
  .swatch-row button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .swatch-row button.active{border-color:var(--ink);}

  .add-cat-row{display:flex;align-items:center;gap:10px;padding:16px 0 6px;}
  .add-cat-row input{border:none;border-bottom:1.5px solid var(--line);background:transparent;font-family:inherit;
                      font-size:14px;padding:8px 2px;color:var(--ink);}
  .add-cat-row .name-input{flex:1;min-width:0;}
  .add-cat-btn{background:var(--ink);color:var(--surface);border:none;width:32px;height:32px;border-radius:50%;
               font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}

  /* ---------- Settings: overall budget ---------- */
  .budget-field-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--line);padding-bottom:9px;}
  .budget-field-wrap.focused{border-color:var(--ink);}
  .budget-field-wrap .currency{font-size:16px;color:var(--ink-soft);font-family:'Fraunces',serif;font-weight:600;}
  .budget-field-wrap input{border:none;background:transparent;font-family:'Fraunces',serif;font-size:24px;font-weight:600;
                            width:100%;color:var(--ink);font-variant-numeric:tabular-nums;}
  .budget-field-wrap input:focus{outline:none;}

  .util-actions{display:flex;flex-direction:column;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .btn-text{background:none;border:none;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--ink);
            text-align:left;padding:13px 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .btn-text .arrow{color:var(--ink-faint);font-weight:400;}
  .btn-text.danger{color:var(--over);}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<div id="app" class="app-shell">
  <div class="header">
    <div class="eyebrow" id="eyebrow">Overview</div>
    <div class="title-row">
      <h1 id="monthTitle" class="display">—</h1>
      <div class="days-tag" id="daysTag">—</div>
    </div>
  </div>

  <div class="donut-wrap">
    <svg id="donutSvg" class="donut-svg" viewBox="0 0 220 220"></svg>
    <div class="donut-center">
      <div class="donut-amount display" id="donutAmount">$0</div>
      <div class="donut-label" id="donutLabel">left to spend</div>
      <div class="donut-sub" id="donutSub"></div>
    </div>
  </div>

  <div>
    <div class="section-label">Categories</div>
    <div class="cat-list" id="catList"></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="openAddBtn">＋&nbsp; Add Expense</button>
    <button class="btn btn-secondary" id="openSettingsBtn">⚙&nbsp; Settings</button>
  </div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- Add Expense Sheet -->
<div class="sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 class="display">Add Expense</h2>
    <button class="close-x" data-close>✕</button>
  </div>

  <div class="field">
    <label>Amount</label>
    <div class="amount-input-wrap" id="amountWrap">
      <span class="currency">$</span>
      <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" id="amountInput" />
    </div>
  </div>

  <div class="field">
    <label>Category</label>
    <div class="chip-grid" id="chipGrid"></div>
  </div>

  <div class="field" style="margin-bottom:8px;">
    <label>Note <span style="text-transform:none;font-weight:400;">(optional)</span></label>
    <input type="text" class="note-input" id="noteInput" placeholder="e.g. Farmers market" maxlength="40" />
  </div>

  <div class="form-error" id="formError"></div>

  <button class="btn btn-primary sheet-submit" id="submitExpenseBtn">Add Expense</button>
</div>

<!-- Settings Sheet -->
<div class="sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 class="display">Settings</h2>
    <button class="close-x" data-close>✕</button>
  </div>

  <div class="field" style="margin-bottom:26px;">
    <label>Monthly Budget</label>
    <div class="budget-field-wrap" id="overallBudgetWrap">
      <span class="currency">$</span>
      <input type="number" inputmode="decimal" step="1" min="0" placeholder="0" id="overallBudgetInput" />
    </div>
  </div>

  <div class="section-label" style="margin-bottom:6px;">Categories</div>
  <div id="settingsCatList"></div>

  <div class="add-cat-row">
    <button class="swatch-btn" id="newCatSwatch" style="background:var(--clay);"></button>
    <input type="text" class="name-input" id="newCatName" placeholder="New category" maxlength="24" />
    <button class="add-cat-btn" id="addCatBtn">＋</button>
  </div>
  <div class="swatch-row" id="newCatSwatchRow" style="display:none;"></div>

  <div class="util-actions">
    <button class="btn-text" id="exportBtn"><span>Export to CSV</span><span class="arrow">↓</span></button>
    <button class="btn-text danger" id="resetBtn"><span>Reset for new month</span><span class="arrow">↻</span></button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const COLOR_VARS = ['clay','sage','dusk','ochre','plum','stone','berry','moss'];
  const DEFAULT_CATEGORIES = [
    { id: 'groceries', name: 'Groceries',     color: 'clay'  },
    { id: 'dining',    name: 'Dining Out',    color: 'ochre' },
    { id: 'transport', name: 'Transport',     color: 'dusk'  },
    { id: 'housing',   name: 'Housing',       color: 'sage'  },
    { id: 'fun',       name: 'Fun & Leisure', color: 'plum'  },
    { id: 'other',     name: 'Other',         color: 'stone' },
  ];
  const DEFAULT_OVERALL_BUDGET = 2400;

  // Works inside Claude (window.storage) AND standalone if hosted/opened outside Claude (localStorage).
  const hasNativeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  const storageAdapter = {
    async get(key){
      if(hasNativeStorage) return window.storage.get(key, false);
      const raw = localStorage.getItem(key);
      if(raw === null) throw new Error('not found');
      return { key, value: raw };
    },
    async set(key, value){
      if(hasNativeStorage) return window.storage.set(key, value, false);
      localStorage.setItem(key, value);
      return { key, value };
    },
  };

  let state = {
    categories: [],
    expenses: [],
    overallBudget: DEFAULT_OVERALL_BUDGET,
  };
  let selectedChipId = null;
  let storageReady = false;

  const now = new Date();
  const YEAR = now.getFullYear();
  const MONTH = now.getMonth(); // 0-indexed
  const TODAY = now.getDate();
  const DAYS_IN_MONTH = new Date(YEAR, MONTH + 1, 0).getDate();
  const DAYS_LEFT = DAYS_IN_MONTH - TODAY + 1;
  const MONTH_NAME = now.toLocaleString('en-US', { month: 'long' });
  const MONTH_KEY = `${YEAR}-${String(MONTH + 1).padStart(2, '0')}`;
  const EXPENSES_KEY = `expenses-${MONTH_KEY}`;

  function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function fmtMoney(n){
    const sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtMoneyShort(n){
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  // ---------------- Storage ----------------
  async function loadState(){
    try{
      let cats = DEFAULT_CATEGORIES;
      try{
        const res = await storageAdapter.get('categories');
        if(res && res.value){ cats = JSON.parse(res.value); }
      }catch(e){ /* key doesn't exist yet — use defaults */ }

      let expenses = [];
      try{
        const res = await storageAdapter.get(EXPENSES_KEY);
        if(res && res.value){ expenses = JSON.parse(res.value); }
      }catch(e){ /* no expenses yet this month */ }

      let overallBudget = DEFAULT_OVERALL_BUDGET;
      try{
        const res = await storageAdapter.get('overall-budget');
        if(res && res.value){ overallBudget = JSON.parse(res.value); }
      }catch(e){ /* not set yet — use default */ }

      state.categories = cats;
      state.expenses = expenses;
      state.overallBudget = overallBudget;
      storageReady = true;
    }catch(e){
      console.error('Storage unavailable, using in-memory defaults', e);
      state.categories = DEFAULT_CATEGORIES;
      state.expenses = [];
      state.overallBudget = DEFAULT_OVERALL_BUDGET;
    }
  }

  async function saveCategories(){
    try{ await storageAdapter.set('categories', JSON.stringify(state.categories)); }
    catch(e){ console.error('Failed saving categories', e); }
  }
  async function saveExpenses(){
    try{ await storageAdapter.set(EXPENSES_KEY, JSON.stringify(state.expenses)); }
    catch(e){ console.error('Failed saving expenses', e); }
  }
  async function saveOverallBudget(){
    try{ await storageAdapter.set('overall-budget', JSON.stringify(state.overallBudget)); }
    catch(e){ console.error('Failed saving overall budget', e); }
  }

  // ---------------- Derived data ----------------
  function categorySpent(catId){
    return state.expenses.filter(e => e.categoryId === catId).reduce((s, e) => s + e.amount, 0);
  }
  function totalBudget(){
    return state.overallBudget || 0;
  }
  function totalSpent(){
    return state.expenses.reduce((s, e) => s + e.amount, 0);
  }

  // ---------------- Rendering ----------------
  function renderHeader(){
    document.getElementById('monthTitle').textContent = `${MONTH_NAME} ${YEAR}`;
    document.getElementById('daysTag').textContent = `${DAYS_LEFT} day${DAYS_LEFT === 1 ? '' : 's'} left`;
  }

  function renderDonut(){
    const svg = document.getElementById('donutSvg');
    const R = 88, CX = 110, CY = 110, SW = 15;
    const circumference = 2 * Math.PI * R;
    const budget = totalBudget();
    const spent = totalSpent();
    const remaining = budget - spent;

    let svgParts = [];
    // base track
    svgParts.push(`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--track)" stroke-width="${SW}" />`);

    // category arcs
    let cumulative = 0;
    state.categories.forEach(cat => {
      const s = categorySpent(cat.id);
      if(s <= 0 || budget <= 0) return;
      let len = (s / budget) * circumference;
      if(cumulative >= circumference) return;
      if(cumulative + len > circumference) len = circumference - cumulative;
      const dashoffset = -cumulative;
      svgParts.push(`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--${cat.color})" stroke-width="${SW}" stroke-linecap="butt" stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${CX} ${CY})" />`);
      cumulative += len;
    });

    // day ticks
    let tickParts = [];
    for(let d = 1; d <= DAYS_IN_MONTH; d++){
      const angle = (d / DAYS_IN_MONTH) * 360;
      const isToday = d === TODAY;
      const isPast = d < TODAY;
      const len = isToday ? 8 : 5;
      const r1 = R + SW/2 + 4;
      const r2 = r1 + len;
      const color = isToday ? 'var(--ink)' : (isPast ? 'var(--ink-faint)' : 'var(--line)');
      const width = isToday ? 2 : 1;
      tickParts.push(`<line x1="0" y1="${-r1}" x2="0" y2="${-r2}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" transform="rotate(${angle} 0 0)" />`);
    }

    svg.innerHTML = svgParts.join('') + `<g transform="translate(${CX} ${CY})">${tickParts.join('')}</g>`;

    const amountEl = document.getElementById('donutAmount');
    const labelEl = document.getElementById('donutLabel');
    const subEl = document.getElementById('donutSub');

    if(remaining < 0){
      amountEl.textContent = fmtMoneyShort(remaining);
      amountEl.classList.add('over');
      labelEl.textContent = 'over budget';
    } else {
      amountEl.textContent = fmtMoneyShort(remaining);
      amountEl.classList.remove('over');
      labelEl.textContent = 'left to spend';
    }
    subEl.textContent = `${fmtMoneyShort(spent)} of ${fmtMoneyShort(budget)} used`;
  }

  function renderCategoryList(){
    const wrap = document.getElementById('catList');
    if(state.categories.length === 0){
      wrap.innerHTML = `<div class="empty-note">No categories yet — add one in Settings.</div>`;
      return;
    }
    const budget = totalBudget();
    wrap.innerHTML = state.categories.map(cat => {
      const spent = categorySpent(cat.id);
      const rawPct = budget > 0 ? (spent / budget) * 100 : (spent > 0 ? 100 : 0);
      const pct = Math.min(100, rawPct);
      const displayPct = Math.round(rawPct);
      return `
        <div class="cat-row">
          <div class="cat-top">
            <div class="cat-name"><span class="dot" style="background:var(--${cat.color})"></span><span class="label">${escapeHtml(cat.name)}</span></div>
            <div class="cat-amounts"><b>${fmtMoneyShort(spent)}</b> · ${displayPct}%</div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:var(--${cat.color});"></div></div>
        </div>`;
    }).join('');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderAll(){
    renderHeader();
    renderDonut();
    renderCategoryList();
  }

  // ---------------- Sheets ----------------
  const overlay = document.getElementById('overlay');
  const addSheet = document.getElementById('addSheet');
  const settingsSheet = document.getElementById('settingsSheet');

  function openSheet(sheet){
    overlay.classList.add('show');
    sheet.classList.add('show');
  }
  function closeSheets(){
    overlay.classList.remove('show');
    addSheet.classList.remove('show');
    settingsSheet.classList.remove('show');
  }
  overlay.addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));

  // ---------------- Add Expense ----------------
  document.getElementById('openAddBtn').addEventListener('click', () => {
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('formError').textContent = '';
    selectedChipId = state.categories[0] ? state.categories[0].id : null;
    renderChips();
    openSheet(addSheet);
    setTimeout(() => document.getElementById('amountInput').focus(), 300);
  });

  function renderChips(){
    const grid = document.getElementById('chipGrid');
    grid.innerHTML = state.categories.map(cat => `
      <button type="button" class="chip ${cat.id === selectedChipId ? 'selected' : ''}" data-cat="${cat.id}">
        <span class="dot" style="background:${cat.id === selectedChipId ? 'var(--surface)' : `var(--${cat.color})`}"></span>${escapeHtml(cat.name)}
      </button>`).join('');
    grid.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedChipId = chip.getAttribute('data-cat');
        renderChips();
      });
    });
  }

  const amountWrap = document.getElementById('amountWrap');
  const amountInput = document.getElementById('amountInput');
  amountInput.addEventListener('focus', () => amountWrap.classList.add('focused'));
  amountInput.addEventListener('blur', () => amountWrap.classList.remove('focused'));

  document.getElementById('submitExpenseBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('formError');
    const amt = parseFloat(amountInput.value);
    if(!amt || amt <= 0){
      errEl.textContent = 'Enter an amount greater than $0.';
      return;
    }
    if(!selectedChipId){
      errEl.textContent = 'Choose a category.';
      return;
    }
    const note = document.getElementById('noteInput').value.trim();
    state.expenses.push({
      id: uid(),
      amount: Math.round(amt * 100) / 100,
      categoryId: selectedChipId,
      note: note || null,
      date: new Date().toISOString(),
    });
    await saveExpenses();
    renderAll();
    closeSheets();
  });

  // ---------------- Settings: overall budget ----------------
  const overallBudgetWrap = document.getElementById('overallBudgetWrap');
  const overallBudgetInput = document.getElementById('overallBudgetInput');
  overallBudgetInput.addEventListener('focus', () => overallBudgetWrap.classList.add('focused'));
  overallBudgetInput.addEventListener('blur', () => overallBudgetWrap.classList.remove('focused'));
  overallBudgetInput.addEventListener('change', async (e) => {
    const v = parseFloat(e.target.value);
    state.overallBudget = isNaN(v) || v < 0 ? 0 : Math.round(v * 100) / 100;
    e.target.value = state.overallBudget;
    await saveOverallBudget();
    renderAll();
  });

  // ---------------- Settings: categories ----------------
  document.getElementById('openSettingsBtn').addEventListener('click', () => {
    overallBudgetInput.value = state.overallBudget || '';
    renderSettingsCategories();
    openSheet(settingsSheet);
  });

  function renderSettingsCategories(){
    const wrap = document.getElementById('settingsCatList');
    wrap.innerHTML = state.categories.map(cat => `
      <div class="setting-cat-row" data-id="${cat.id}">
        <button class="swatch-btn" data-role="swatch" style="background:var(--${cat.color})"></button>
        <input class="name-input" data-role="name" value="${escapeHtml(cat.name)}" maxlength="24" />
        <button class="icon-btn" data-role="delete">✕</button>
      </div>
      <div class="swatch-row" data-role="swatchrow" style="display:none;"></div>
    `).join('');

    wrap.querySelectorAll('.setting-cat-row').forEach(row => {
      const id = row.getAttribute('data-id');
      const cat = state.categories.find(c => c.id === id);
      const swatchBtn = row.querySelector('[data-role="swatch"]');
      const swatchRow = row.nextElementSibling;

      swatchBtn.addEventListener('click', () => {
        const open = swatchRow.style.display !== 'none';
        wrap.querySelectorAll('[data-role="swatchrow"]').forEach(el => el.style.display = 'none');
        if(open){ swatchRow.style.display = 'none'; return; }
        swatchRow.innerHTML = COLOR_VARS.map(cv => `<button type="button" data-color="${cv}" class="${cv === cat.color ? 'active' : ''}" style="background:var(--${cv})"></button>`).join('');
        swatchRow.querySelectorAll('button').forEach(b => {
          b.addEventListener('click', async () => {
            cat.color = b.getAttribute('data-color');
            await saveCategories();
            renderSettingsCategories();
            renderAll();
          });
        });
        swatchRow.style.display = 'flex';
      });

      row.querySelector('[data-role="name"]').addEventListener('change', async (e) => {
        cat.name = e.target.value.trim() || cat.name;
        await saveCategories();
        renderAll();
      });
      row.querySelector('[data-role="delete"]').addEventListener('click', async () => {
        state.categories = state.categories.filter(c => c.id !== id);
        await saveCategories();
        renderSettingsCategories();
        renderAll();
      });
    });
  }

  // add category
  let newCatColor = 'clay';
  const newCatSwatch = document.getElementById('newCatSwatch');
  const newCatSwatchRow = document.getElementById('newCatSwatchRow');
  newCatSwatch.addEventListener('click', () => {
    const open = newCatSwatchRow.style.display !== 'none';
    if(open){ newCatSwatchRow.style.display = 'none'; return; }
    newCatSwatchRow.innerHTML = COLOR_VARS.map(cv => `<button type="button" data-color="${cv}" class="${cv === newCatColor ? 'active' : ''}" style="background:var(--${cv})"></button>`).join('');
    newCatSwatchRow.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        newCatColor = b.getAttribute('data-color');
        newCatSwatch.style.background = `var(--${newCatColor})`;
        newCatSwatchRow.style.display = 'none';
      });
    });
    newCatSwatchRow.style.display = 'flex';
  });

  document.getElementById('addCatBtn').addEventListener('click', async () => {
    const nameEl = document.getElementById('newCatName');
    const name = nameEl.value.trim();
    if(!name) { nameEl.focus(); return; }
    state.categories.push({
      id: uid(),
      name,
      color: newCatColor,
    });
    await saveCategories();
    nameEl.value = '';
    newCatColor = 'clay';
    newCatSwatch.style.background = 'var(--clay)';
    renderSettingsCategories();
    renderAll();
  });

  // ---------------- Export CSV ----------------
  document.getElementById('exportBtn').addEventListener('click', () => {
    const rows = [['Date', 'Category', 'Amount', 'Note']];
    state.expenses
      .slice()
      .sort((a, b) => new Date(a.date) - new Date(b.date))
      .forEach(e => {
        const cat = state.categories.find(c => c.id === e.categoryId);
        rows.push([
          new Date(e.date).toLocaleDateString('en-US'),
          cat ? cat.name : 'Uncategorized',
          e.amount.toFixed(2),
          e.note || '',
        ]);
      });
    const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `budget-${MONTH_KEY}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------------- Reset ----------------
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const ok = confirm(`Clear all ${state.expenses.length} expense${state.expenses.length === 1 ? '' : 's'} logged for ${MONTH_NAME}? Your categories and monthly budget will stay the same.`);
    if(!ok) return;
    state.expenses = [];
    await saveExpenses();
    renderAll();
    closeSheets();
  });

  // ---------------- Init ----------------
  (async function init(){
    await loadState();
    renderAll();
  })();

})();
</script>
</body>
</html>
